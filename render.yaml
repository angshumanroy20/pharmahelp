services:
  - type: web
    name: pharmahelp-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DB_DRIVER
        value: embedded
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
